name: Run sleep_and_list_dir

on:
  workflow_dispatch:

jobs:
  run-sleep-and-list-dir:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sleep_and_list_dir.py
        run: python sleep_and_list_dir.py
